<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍕 PizzaETA Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; }
    header { background: #1a1a1a; display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 2px solid #e53935; }
    header h1 { font-size: 1.4rem; }
    #last-update { font-size: 0.8rem; color: #888; }
    .stats { display: flex; gap: 16px; padding: 16px 24px; flex-wrap: wrap; }
    .stat-card { background: #1e1e1e; border-radius: 10px; padding: 14px 20px; flex: 1; min-width: 120px; text-align: center; }
    .stat-card .val { font-size: 2rem; font-weight: bold; color: #e53935; }
    .stat-card .lbl { font-size: 0.75rem; color: #aaa; margin-top: 4px; }
    .section { padding: 0 24px 24px; }
    .section h2 { margin-bottom: 12px; font-size: 1.1rem; color: #ccc; }
    table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 10px; overflow: hidden; }
    th { background: #2a2a2a; padding: 10px 12px; text-align: left; font-size: 0.75rem; color: #888; text-transform: uppercase; }
    td { padding: 10px 12px; border-top: 1px solid #2a2a2a; font-size: 0.85rem; }
    tr:hover td { background: #252525; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; }
    .badge-green { background: #1b5e20; color: #69f0ae; }
    .badge-orange { background: #e65100; color: #fff; }
    .badge-blue { background: #0d47a1; color: #90caf9; }
    .badge-gray { background: #333; color: #aaa; }
    /* Drivers section */
    .drivers-panel { background: #1e1e1e; border-radius: 10px; padding: 16px; }
    .drivers-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .driver-chip { background: #2a2a2a; border: 2px solid #333; border-radius: 8px; padding: 8px 14px; cursor: pointer; transition: all 0.2s; user-select: none; }
    .driver-chip:hover { border-color: #e53935; }
    .driver-chip.active { border-color: #e53935; background: #3a1a1a; }
    .driver-chip .dname { font-weight: bold; font-size: 0.9rem; }
    .driver-chip .dtel { font-size: 0.7rem; color: #888; margin-top: 2px; }
    .driver-chip .dorders { font-size: 0.7rem; color: #e53935; margin-top: 2px; }
    #driver-search { background: #2a2a2a; border: 1px solid #444; color: #f0f0f0; padding: 8px 12px; border-radius: 6px; width: 100%; max-width: 300px; margin-bottom: 12px; }
    #drivers-status { color: #888; font-size: 0.85rem; margin-bottom: 8px; }
    .error { color: #ef5350; padding: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>🍕 PizzaETA Dashboard</h1>
    <span id="last-update">Laden...</span>
  </header>

  <div class="stats">
    <div class="stat-card"><div class="val" id="total_orders">-</div><div class="lbl">Totaal orders</div></div>
    <div class="stat-card"><div class="val" id="active">-</div><div class="lbl">Actief</div></div>
    <div class="stat-card"><div class="val" id="delivered">-</div><div class="lbl">Bezorgd</div></div>
    <div class="stat-card"><div class="val" id="date">-</div><div class="lbl">Datum</div></div>
  </div>

  <div class="section">
    <h2>🚴 Bezorgers</h2>
    <div class="drivers-panel">
      <input type="text" id="driver-search" placeholder="Zoek bezorger..." oninput="filterDrivers()" />
      <div id="drivers-status">Laden...</div>
      <div class="drivers-grid" id="drivers-grid"></div>
    </div>
  </div>

  <div class="section">
    <h2>📋 Orders</h2>
    <div id="table-container"><p style="padding:16px;color:#888">Laden...</p></div>
  </div>

  <script>
    const ORDERS_API = '/api/orders';
    const DRIVERS_API = '/api/deliverers';
    let allDrivers = [];
    let activeDrivers = new Set();

    function fmtTime(str) {
      if (!str) return '-';
      try {
        const d = new Date(str.replace(' ', 'T'));
        if (isNaN(d)) return str;
        return d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
      } catch { return str; }
    }

    function timeAgo(str) {
      if (!str) return '-';
      try {
        const d = new Date(str.replace(' ', 'T'));
        const mins = Math.floor((Date.now() - d) / 60000);
        if (mins < 1) return 'nu';
        if (mins < 60) return mins + ' min';
        return Math.floor(mins/60) + 'u ' + (mins%60) + 'm';
      } catch { return '-'; }
    }

    function getStatusBadge(s) {
      const sl = (s||'').toLowerCase();
      if (sl.includes('deliver') || sl.includes('bezorg')) return `<span class="badge badge-green">${s}</span>`;
      if (sl.includes('pending') || sl.includes('wacht')) return `<span class="badge badge-orange">${s}</span>`;
      if (sl.includes('confirm') || sl.includes('accept')) return `<span class="badge badge-blue">${s}</span>`;
      return `<span class="badge badge-gray">${s||'?'}</span>`;
    }

    function fmtPrice(v) {
      if (!v && v !== 0) return '-';
      const n = parseFloat(String(v).replace(',','.'));
      if (isNaN(n)) return v;
      return '€' + n.toFixed(2);
    }

    async function loadOrders() {
      const container = document.getElementById('table-container');
      try {
        const res = await fetch(ORDERS_API);
        const data = await res.json();
        if (!data.success) { container.innerHTML = `<p class="error">Fout: ${data.error||'Onbekend'}</p>`; return; }
        const orders = data.orders || [];
        document.getElementById('total_orders').textContent = data.total || orders.length;
        document.getElementById('date').textContent = data.date || '-';
        let active = 0, delivered = 0;
        orders.forEach(o => {
          const sl = (o.status||'').toLowerCase();
          if (sl.includes('deliver') || sl.includes('bezorg')) delivered++;
          else active++;
        });
        document.getElementById('active').textContent = active;
        document.getElementById('delivered').textContent = delivered;
        document.getElementById('last-update').textContent = 'Bijgewerkt: ' + new Date().toLocaleTimeString('nl-NL');
        if (!orders.length) { container.innerHTML = '<p style="padding:16px;color:#888">Geen orders.</p>'; return; }
        let html = '<table><thead><tr><th>#Order</th><th>Status</th><th>Tijd</th><th>Geleden</th><th>Adres</th><th>Bedrag</th></tr></thead><tbody>';
        orders.forEach(o => {
          const addr = [o.street, o.housenumber, o.zipcode, o.city].filter(Boolean).join(' ') || o.address || '-';
          html += `<tr><td>${o.id||'-'}</td><td>${getStatusBadge(o.status)}</td><td>${fmtTime(o.time||o.created_at||o.date)}</td><td>${timeAgo(o.time||o.created_at||o.date)}</td><td>${addr}</td><td>${fmtPrice(o.amount||o.total||o.price)}</td></tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      } catch(e) { container.innerHTML = `<p class="error">Netwerk fout: ${e.message}</p>`; }
    }

    function filterDrivers() {
      const q = document.getElementById('driver-search').value.toLowerCase();
      const chips = document.querySelectorAll('.driver-chip');
      chips.forEach(c => { c.style.display = c.dataset.name.includes(q) ? '' : 'none'; });
    }

    function toggleDriver(id) {
      if (activeDrivers.has(id)) activeDrivers.delete(id);
      else activeDrivers.add(id);
      document.querySelectorAll('.driver-chip').forEach(c => {
        c.classList.toggle('active', activeDrivers.has(c.dataset.id));
      });
    }

    async function loadDrivers() {
      const grid = document.getElementById('drivers-grid');
      const status = document.getElementById('drivers-status');
      try {
        const res = await fetch(DRIVERS_API);
        const data = await res.json();
        allDrivers = data.deliverers || [];
        status.textContent = allDrivers.length + ' bezorgers beschikbaar';
        grid.innerHTML = allDrivers.map(d => `
          <div class="driver-chip" data-id="${d.id}" data-name="${(d.name||'').toLowerCase()}" onclick="toggleDriver('${d.id}')">
            <div class="dname">${d.name||d.login||'?'}</div>
            ${d.tel ? `<div class="dtel">📞 ${d.tel}</div>` : ''}
            <div class="dorders">📦 ${d.orders||0} orders vandaag</div>
          </div>`).join('');
      } catch(e) { status.textContent = 'Fout laden bezorgers'; }
    }

    loadOrders();
    loadDrivers();
    setInterval(loadOrders, 30000);
    setInterval(loadDrivers, 60000);
  </script>
</body>
</html>
