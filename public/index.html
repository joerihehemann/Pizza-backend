<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍕 PizzaETA Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #222;
    }
    h1 { font-size: 1.8rem; font-weight: 700; }
    .last-update { font-size: 0.9rem; color: #888; }
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1600px;
      margin: 0 auto;
    }
    .column {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 20px;
      min-height: 400px;
    }
    .column h2 {
      font-size: 1.3rem;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #333;
    }
    .column.delivering h2 { color: #ff6b35; }
    .column.returning h2 { color: #4ecdc4; }
    .driver-card {
      background: #242424;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid #555;
    }
    .driver-card.delivering { border-left-color: #ff6b35; }
    .driver-card.returning { border-left-color: #4ecdc4; }
    .driver-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .driver-name .badge {
      background: #ff6b35;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .driver-info {
      display: grid;
      gap: 6px;
      font-size: 0.95rem;
      color: #aaa;
    }
    .driver-info .row {
      display: flex;
      justify-content: space-between;
    }
    .driver-info .label { color: #777; }
    .driver-info .value { color: #fff; font-weight: 500; }
    .eta {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #333;
      font-size: 1rem;
      font-weight: 600;
    }
    .eta.delivering { color: #ff6b35; }
    .eta.returning { color: #4ecdc4; }
    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 1rem;
    }
    .loading {
      text-align: center;
      padding: 60px;
      font-size: 1.1rem;
      color: #888;
    }
    @media (max-width: 900px) {
      .columns { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🍕 PizzaETA Tracker</h1>
    <div class="last-update" id="lastUpdate">Laden...</div>
  </header>
  <div class="columns">
    <div class="column delivering">
      <h2>🚗 Onderweg naar klant</h2>
      <div id="delivering" class="loading">Bezorgers ophalen...</div>
    </div>
    <div class="column returning">
      <h2>🏠 Op weg terug naar hub</h2>
      <div id="returning" class="loading">Bezorgers ophalen...</div>
    </div>
  </div>
  <script>
    const HUB_LAT = 51.4502; // Tilburg centrum
    const HUB_LNG = 5.4792;

    function distance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function formatETA(seconds) {
      if (!seconds || seconds <= 0) return 'Onbekend';
      const min = Math.round(seconds / 60);
      return min + ' min';
    }

    function renderDriver(d, orders) {
      const isDelivering = d.status === 'delivering';
      const orderList = orders.filter(o => o.deliverer === d.id);
      
      let etaHTML = '';
      if (isDelivering && orderList.length > 0) {
        const order = orderList[0];
        etaHTML = `<div class="eta delivering">ETA: ${formatETA(d.avg_n)}</div>`;
      } else if (!isDelivering && d.coord) {
        const distToHub = d.lat ? distance(d.lat, d.lng, HUB_LAT, HUB_LNG) : 0;
        const etaSeconds = distToHub > 0 ? (distToHub / 30) * 3600 : d.avg_n;
        etaHTML = `<div class="eta returning">ETA naar hub: ${formatETA(etaSeconds)}</div>`;
      }

      return `
        <div class="driver-card ${d.status}">
          <div class="driver-name">
            ${d.name}
            ${d.orders > 0 ? `<span class="badge">${d.orders} order${d.orders > 1 ? 's' : ''}</span>` : ''}
          </div>
          <div class="driver-info">
            ${d.tel ? `<div class="row"><span class="label">Tel:</span><span class="value">${d.tel}</span></div>` : ''}
            ${isDelivering && orderList.length > 0 ? `<div class="row"><span class="label">Adres:</span><span class="value">${orderList[0].address || 'Onbekend'}</span></div>` : ''}
            ${d.coord ? `<div class="row"><span class="label">GPS:</span><span class="value">Actief</span></div>` : ''}
          </div>
          ${etaHTML}
        </div>
      `;
    }

    async function load() {
      try {
        const [deliverersRes, ordersRes] = await Promise.all([
          fetch('/api/deliverers'),
          fetch('/api/orders')
        ]);
        const deliverersData = await deliverersRes.json();
        const ordersData = await ordersRes.json();

        const deliverers = deliverersData.deliverers || [];
        const orders = ordersData.orders || [];

        const delivering = deliverers.filter(d => d.status === 'delivering' && d.coord);
        const returning = deliverers.filter(d => d.status === 'returning' && d.coord);

        const deliveringEl = document.getElementById('delivering');
        const returningEl = document.getElementById('returning');

        if (delivering.length === 0) {
          deliveringEl.innerHTML = '<div class="no-data">Geen bezorgers onderweg naar klanten</div>';
        } else {
          deliveringEl.innerHTML = delivering.map(d => renderDriver(d, orders)).join('');
        }

        if (returning.length === 0) {
          returningEl.innerHTML = '<div class="no-data">Geen bezorgers op weg terug</div>';
        } else {
          returningEl.innerHTML = returning.map(d => renderDriver(d, orders)).join('');
        }

        const now = new Date();
        document.getElementById('lastUpdate').textContent = 
          `Bijgewerkt: ${now.toLocaleTimeString('nl-NL')}`;
      } catch (err) {
        console.error(err);
        document.getElementById('delivering').innerHTML = 
          '<div class="no-data">Fout bij laden</div>';
        document.getElementById('returning').innerHTML = 
          '<div class="no-data">Fout bij laden</div>';
      }
    }

    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
