<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍕 PizzaETA Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
    }
    header {
      background: #1a1a1a;
      border-bottom: 3px solid #ff4500;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.6rem; color: #ff4500; }
    header h1 span { color: #fff; }
    .status-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .live-badge {
      font-size: 0.8rem;
      background: #1f1f1f;
      border: 1px solid #333;
      padding: 4px 12px;
      border-radius: 20px;
      color: #aaa;
    }
    .stats {
      display: flex;
      gap: 16px;
      padding: 20px 24px;
      flex-wrap: wrap;
    }
    .stat-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px 24px;
      flex: 1;
      min-width: 140px;
      text-align: center;
    }
    .stat-card .num {
      font-size: 2.4rem;
      font-weight: 700;
      color: #ff4500;
    }
    .stat-card .label {
      font-size: 0.8rem;
      color: #888;
      margin-top: 4px;
    }
    .section { padding: 0 24px 24px; }
    .section h2 {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      min-width: 700px;
    }
    thead tr { background: #222; }
    th {
      padding: 12px 14px;
      text-align: left;
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    td {
      padding: 11px 14px;
      font-size: 0.88rem;
      border-top: 1px solid #222;
    }
    tr:hover td { background: #1f1f1f; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-new { background: #1e3a5f; color: #60a5fa; }
    .badge-preparing { background: #3b2a00; color: #fbbf24; }
    .badge-enroute { background: #2a1a3a; color: #c084fc; }
    .badge-ready { background: #14532d; color: #4ade80; }
    .badge-delivered { background: #1f1f1f; color: #888; }
    .badge-other { background: #2a2a2a; color: #aaa; }
    .address-cell { color: #ccc; font-size: 0.82rem; }
    .price-cell { color: #ff4500; font-weight: 600; }
    .time-cell { white-space: nowrap; color: #aaa; }
    .loading {
      text-align: center;
      padding: 48px;
      color: #555;
    }
    .error-box {
      background: #2a0a0a;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 16px;
      color: #fca5a5;
    }
    .refresh-info {
      font-size: 0.75rem;
      color: #555;
      padding: 0 24px 16px;
    }
    #countdown { color: #ff4500; font-weight: 600; }
  </style>
</head>
<body>

<header>
  <h1>🍕 Pizza<span>ETA</span> Dashboard</h1>
  <span class="live-badge"><span class="status-dot"></span>LIVE</span>
</header>

<div class="stats">
  <div class="stat-card">
    <div class="num" id="total">—</div>
    <div class="label">Orders vandaag</div>
  </div>
  <div class="stat-card">
    <div class="num" id="active">—</div>
    <div class="label">Actief / bezig</div>
  </div>
  <div class="stat-card">
    <div class="num" id="delivered">—</div>
    <div class="label">Bezorgd</div>
  </div>
  <div class="stat-card">
    <div class="num" id="datum">—</div>
    <div class="label">Datum</div>
  </div>
</div>

<div class="refresh-info">Automatisch vernieuwen in <span id="countdown">30</span>s</div>

<div class="section">
  <h2>Live Orders</h2>
  <div class="table-wrap">
    <div id="table-container"><div class="loading">⏳ Orders laden...</div></div>
  </div>
</div>

<script>
  const API = '/api/orders';
  let timer = 30;
  let interval;

  function statusBadge(s) {
    const map = {
      new:       ['badge-new',       'Nieuw'],
      pending:   ['badge-new',       'Wacht'],
      init:      ['badge-new',       'Nieuw'],
      preparing: ['badge-preparing', 'Bezig'],
      in_kitchen:['badge-preparing', 'Keuken'],
      enroute:   ['badge-enroute',   'Onderweg'],
      on_the_way:['badge-enroute',   'Onderweg'],
      ready:     ['badge-ready',     'Klaar'],
      delivered: ['badge-delivered', 'Bezorgd'],
      completed: ['badge-delivered', 'Klaar'],
    };
    const key = (s || '').toLowerCase();
    const [cls, label] = map[key] || ['badge-other', s || '?'];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  function formatTime(isoStr) {
    if (!isoStr) return '—';
    const d = new Date(isoStr);
    if (isNaN(d)) return isoStr;
    return d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  }

  function minutesAgo(isoStr) {
    if (!isoStr) return '—';
    const d = new Date(isoStr);
    if (isNaN(d)) return '—';
    const diff = Math.round((Date.now() - d.getTime()) / 60000);
    if (diff < 0) return '—';
    if (diff === 0) return 'zojuist';
    return `${diff} min`;
  }

  async function loadOrders() {
    const container = document.getElementById('table-container');
    try {
      const res = await fetch(API);
      const data = await res.json();

      if (!data.success) {
        container.innerHTML = `<div class="error-box">❌ ${data.error || 'Fout'}<br><small>${data.details || data.raw || ''}</small></div>`;
        return;
      }

      const orders = data.orders || [];
      document.getElementById('total').textContent = data.total_orders ?? orders.length;
      document.getElementById('datum').textContent = data.date || '—';

      const activeStatuses = ['init','new','pending','preparing','in_kitchen','enroute','on_the_way','ready'];
      const active = orders.filter(o => activeStatuses.includes((o.status||'').toLowerCase())).length;
      const done   = orders.filter(o => ['delivered','completed'].includes((o.status||'').toLowerCase())).length;
      document.getElementById('active').textContent = active;
      document.getElementById('delivered').textContent = done;

      if (orders.length === 0) {
        container.innerHTML = '<div class="loading">Geen orders gevonden voor vandaag.</div>';
        return;
      }

      const rows = orders.map(o => {
        const id      = o.id || '—';
        const status  = o.status || '—';
        const time    = formatTime(o.date);
        const ago     = minutesAgo(o.date);
        const address = o.address || '—';
        const price   = o.total_price ? `€${parseFloat(o.total_price).toFixed(2)}` : '—';
        return `<tr>
          <td>#${id}</td>
          <td>${statusBadge(status)}</td>
          <td class="time-cell">${time}</td>
          <td class="time-cell">${ago}</td>
          <td class="address-cell">${address}</td>
          <td class="price-cell">${price}</td>
        </tr>`;
      }).join('');

      container.innerHTML = `
        <table>
          <thead><tr>
            <th>#Order</th>
            <th>Status</th>
            <th>Tijd</th>
            <th>Geleden</th>
            <th>Adres</th>
            <th>Bedrag</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch (e) {
      container.innerHTML = `<div class="error-box">❌ Verbindingsfout: ${e.message}</div>`;
    }
  }

  function startCountdown() {
    clearInterval(interval);
    timer = 30;
    interval = setInterval(() => {
      timer--;
      document.getElementById('countdown').textContent = timer;
      if (timer <= 0) {
        loadOrders();
        timer = 30;
      }
    }, 1000);
  }

  loadOrders();
  startCountdown();
</script>
</body>
</html>
